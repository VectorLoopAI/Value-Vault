# reward_config.yaml — RL reward constants (paper §3.1.2 / SEG 07)
# R = w_acc * R_acc + w_len * R_len
# All numeric values below are published in the paper. See ../code/reward.py for the
# implementation these constants feed.

accuracy_reward:
  # Eight strict validity checks (Appendix A). Fail any one -> R_acc = 0 outright,
  # regardless of cost.
  validity_checks:
    - Parsable
    - Legal-move          # each step's Manhattan distance <= 1
    - Conflict-free        # no vertex or edge conflict between agents
    - Goal-reached
    - Start-correct
    - Agent-count           # matches the problem statement
    - Hole-free
    - In-bounds
  # If all eight pass, R_acc is shaped by the cost gap to ground truth:
  #   c = model_cost - gt_cost
  #   c_max = 2 * gt_cost
  #   R_acc(c) = 1.0                          if c == 0
  #            = 1.0 - 0.7 * (c / c_max)      if 0 < c <= c_max   (linear [0,c_max] -> [1.0,0.3])
  #            = 0.3                          if c > c_max
  cost_gap_multiplier: 2.0        # c_max = cost_gap_multiplier * gt_cost
  reward_at_zero_gap: 1.0
  reward_floor_saturated: 0.3
  shaping_slope: 0.7               # the "0.7" in 1.0 - 0.7*(c/c_max)
  # Fallback when ground-truth cost can't be parsed for the shaping calc.
  unparseable_gt_fallback: 0.5

length_reward:
  # R_len = 0                                    if len(response) <= L1
  #       = -(len - L1) / (L2 - L1)               if L1 < len < L2
  #       = -1                                     if len >= L2
  soft_threshold_L1: 1500     # tokens
  hard_threshold_L2: 4096     # tokens

adaptive_weights:
  # (w_acc, w_len) shift emphasis from brevity to correctness as the model learns
  # concision. r = EMA of the short-response ratio (fraction of responses with
  # len <= L1) across recent batches.
  #   (w_acc, w_len) = (0.5, 0.5)                          if r < r_low
  #   linearly interpolated to (0.8, 0.2)                  on r in [r_low, r_high]
  #   held at (0.8, 0.2)                                   once r >= r_high
  r_low: 0.5
  r_high: 0.9
  weights_low: { w_acc: 0.5, w_len: 0.5 }
  weights_high: { w_acc: 0.8, w_len: 0.2 }
